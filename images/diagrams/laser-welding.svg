<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="825" viewBox="0 0 1100 825" role="img" aria-labelledby="title desc">
  <title id="title">Схема лазерной сварки</title>
  <desc id="desc">Сфокусированный луч соединяет две тонкостенные детали узким швом с локальной зоной нагрева.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#d8d4ca" stroke-width="1"/></pattern>
    <pattern id="metal" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(24)"><path d="M0 0V15" stroke="#969189" stroke-width="3"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17191c"/></marker>
  </defs>
  <rect width="1100" height="825" fill="#f3f1eb"/>
  <rect x="28" y="28" width="1044" height="769" fill="url(#grid)" stroke="#17191c" stroke-width="2"/>
  <path d="M66 92H214" stroke="#f2a900" stroke-width="8"/>
  <text x="66" y="132" fill="#17191c" font-family="IBM Plex Mono, monospace" font-size="23" font-weight="600" letter-spacing="3">ЛОКАЛЬНЫЙ НАГРЕВ</text>
  <text x="66" y="205" fill="#17191c" font-family="IBM Plex Sans, sans-serif" font-size="62" font-weight="700">Лазерный шов</text>
  <g transform="translate(0 18)">
    <rect x="463" y="250" width="174" height="118" fill="#17191c"/>
    <path d="M494 368H606L588 426H512Z" fill="#e0ddd4" stroke="#17191c" stroke-width="7"/>
    <path d="M530 426H570L558 506H542Z" fill="#17191c"/>
    <path d="M550 506L518 628H582Z" fill="#f2a900" opacity=".9"/>
    <path d="M120 628H540V746H120Z" fill="url(#metal)" stroke="#17191c" stroke-width="8"/>
    <path d="M560 628H980V746H560Z" fill="url(#metal)" stroke="#17191c" stroke-width="8"/>
    <path d="M550 626V746" stroke="#f2a900" stroke-width="12"/>
    <path d="M462 580H638" stroke="#17191c" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="450" y="554" fill="#17191c" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="600">УЗКАЯ ЗОНА НАГРЕВА</text>
  </g>
  <g transform="translate(66 254)">
    <rect width="310" height="104" fill="#17191c"/>
    <text x="24" y="42" fill="#f3f1eb" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="2">ОБОРУДОВАНИЕ</text>
    <text x="24" y="80" fill="#f2a900" font-family="IBM Plex Sans, sans-serif" font-size="30" font-weight="700">SUP-AMF-D</text>
  </g>
</svg>
