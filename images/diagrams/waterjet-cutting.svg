<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="825" viewBox="0 0 1100 825" role="img" aria-labelledby="title desc">
  <title id="title">Схема гидроабразивной резки</title>
  <desc id="desc">Сопло направляет струю на плиту; схема отмечает давление до 4000 бар и отсутствие термической зоны.</desc>
