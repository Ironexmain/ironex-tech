  <text x="66" y="132" fill="#17191c" font-family="IBM Plex Mono, monospace" font-size="23" font-weight="600" letter-spacing="3">ХОЛОДНЫЙ РАСКРОЙ</text>
  <text x="66" y="205" fill="#17191c" font-family="IBM Plex Sans, sans-serif" font-size="62" font-weight="700">Гидроабразив</text>
  <g transform="translate(598 130)">
